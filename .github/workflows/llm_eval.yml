name: LLM Evaluation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install deepeval groq python-dotenv pytest

      - name: Run DeepEval tests
        env:
          YOUR_GROQ_API_KEY: ${{ secrets.YOUR_GROQ_API_KEY }}
        run: |
          pytest test_redteam.py test_deepeval_pytest.py -v
